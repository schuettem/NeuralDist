[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraldist"
version = "0.1.0"
description = "Machine learning models for learning a (un)conditional distribution function"
authors = [
    { name = "Miklas Schütte" }
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "tensorflow>=2.16",
    "keras>=3.0",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "ipykernel", "scipy"]
dev = ["pytest", "ruff", "pyyaml", "scipy"]
all = ["neuraldist[notebooks,dev]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuraldist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100